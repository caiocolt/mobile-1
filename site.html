<section class="max-w-4xl mx-auto p-6 bg-[#0F0F0F] rounded-2xl border border-[#00FF88]/20">
  <div class="flex items-center gap-3 mb-8 border-b border-[#00FF88]/20 pb-4">
    <div class="w-10 h-10 bg-[#00FF88] rounded-lg flex items-center justify-center font-bold text-black">WC</div>
    <div>
      <h2 class="text-2xl font-bold text-white">Formulário de Atualização</h2>
      <p class="text-gray-400 text-sm">WC Studio - Marília Pereira Nutricionista</p>
    </div>
  </div>

  <form action="https://formsubmit.co/seuemail@gmail.com" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-5" enctype="multipart/form-data">
    <input type="hidden" name="_subject" value="Nova atualização - Site Marília">
    <input type="hidden" name="_captcha" value="false">
    
    <div class="md:col-span-2">
      <label class="text-white text-sm mb-2 block">Atualizações *</label>
      <textarea name="atualizacoes" required rows="3" placeholder="Ex: Adicionar nova seção de serviços, atualizar valores..." class="w-full p-3 rounded-lg bg-[#1A1A1A] border border-[#00FF88]/30 text-white focus:border-[#00FF88] outline-none"></textarea>
    </div>

    <div>
      <label class="text-white text-sm mb-2 block">CRM / WhatsApp *</label>
      <input type="text" name="crm" required placeholder="Ex: wa.me/5586..." class="w-full p-3 rounded-lg bg-[#1A1A1A] border border-[#00FF88]/30 text-white outline-none">
    </div>

    <div>
      <label class="text-white text-sm mb-2 block">Região de Atendimento *</label>
      <input type="text" name="regiao" required placeholder="Ex: Parnaíba - PI e Online" class="w-full p-3 rounded-lg bg-[#1A1A1A] border border-[#00FF88]/30 text-white outline-none">
    </div>

    <div>
      <label class="text-white text-sm mb-2 block">Fotos de Trabalho (Opcional)</label>
      <input type="file" name="fotos" multiple accept="image/*" class="w-full p-2 rounded-lg bg-[#1A1A1A] border border-[#00FF88]/30 text-white text-sm">
    </div>

    <div>
      <label class="text-white text-sm mb-2 block">Feedbacks de Clientes (Opcional)</label>
      <input type="text" name="feedback" placeholder="Cole os depoimentos aqui" class="w-full p-3 rounded-lg bg-[#1A1A1A] border border-[#00FF88]/30 text-white outline-none">
    </div>

    <div>
      <label class="text-white text-sm mb-2 block">Horários de Atendimento *</label>
      <input type="text" name="horarios" required placeholder="Ex: Seg a Sex 08h às 18h" class="w-full p-3 rounded-lg bg-[#1A1A1A] border border-[#00FF88]/30 text-white outline-none">
    </div>

    <div>
      <label class="text-white text-sm mb-2 block">Inclusão de Atendimento</label>
      <input type="text" name="inclusao" placeholder="Ex: Novo serviço de nutrição esportiva" class="w-full p-3 rounded-lg bg-[#1A1A1A] border border-[#00FF88]/30 text-white outline-none">
    </div>

    <div>
      <label class="text-white text-sm mb-2 block">E-mail Atualizado *</label>
      <input type="email" name="email" required placeholder="cliente@empresa.com.br" class="w-full p-3 rounded-lg bg-[#1A1A1A] border border-[#00FF88]/30 text-white outline-none">
    </div>

    <div>
      <label class="text-white text-sm mb-2 block">Seu Domínio *</label>
      <input type="text" name="dominio" required placeholder="www.marilianutricionista.com.br" class="w-full p-3 rounded-lg bg-[#1A1A1A] border border-[#00FF88]/30 text-white outline-none">
    </div>

    <div class="md:col-span-2 flex justify-end gap-3 mt-4">
      <button type="button" class="px-6 py-3 rounded-lg border border-gray-600 text-white">Cancelar</button>
      <button type="submit" class="px-8 py-3 rounded-lg bg-[#00FF88] text-black font-bold hover:bg-[#00CC6A] transition">Salvar Atualizações</button>
    </div>
  </form>
  <p class="text-gray-500 text-xs mt-4 text-center">Resposta automática • Última atualização: 01/10/2026</p>
</section>
